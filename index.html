<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#16382f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="轻捷">
  <meta name="description" content="专为 iPhone 设计的本地隐私工具箱：扫描、图片、文字、计算、二维码和便签。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>轻捷 · 随手工具箱</title>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10M8 9.5h8M8 14.5h6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 4.5-4 3 2.5 2.5-2 4 3.5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8.5 19h7M4 10h4M16 10h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="m4.5 15.5 11-11a2.1 2.1 0 0 1 3 0l1 1a2.1 2.1 0 0 1 0 3l-11 11a2.1 2.1 0 0 1-3 0l-1-1a2.1 2.1 0 0 1 0-3Z"/><path d="m13 7 2 2M10 10l2 2M7 13l2 2"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M19 14h1v3M14 18v2h3M20 20h.01M8 6H6v2h2zM18 6h-2v2h2zM8 16H6v2h2z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14.5 3.5V8H19M8 12h8M8 16h6"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5h14a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2h12"/><path d="M20 11h-5a2 2 0 0 0 0 4h5M15 13h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3.5 11 8.5-7 8.5 7M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.6a7 7 0 0 0-.7-1.6l1-1.9-2.1-2.1-1.9 1A7 7 0 0 0 11.5 5L11 3H8l-.6 2a7 7 0 0 0-1.6.7l-1.9-1-2.1 2.1 1 1.9A7 7 0 0 0 2.2 10L0 10.5v3l2 .6a7 7 0 0 0 .7 1.6l-1 1.9 2.1 2.1 1.9-1a7 7 0 0 0 1.6.7l.6 2h3l.6-2a7 7 0 0 0 1.6-.7l1.9 1 2.1-2.1-1-1.9a7 7 0 0 0 .7-1.6Z" transform="translate(1.5 -.2) scale(.88)"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l1.5-2h5L16 7h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 3h6l1 4H8l1-4ZM6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
  </svg>

  <div id="app">
    <header class="topbar">
      <div class="brand-mark">轻</div>
      <div class="brand-copy"><strong>轻捷</strong><span>本地 · 安全 · 无广告</span></div>
      <button class="icon-button" id="themeToggle" aria-label="切换深色模式"><svg><use href="#i-moon"/></svg></button>
    </header>

    <main>
      <section class="view active" id="homeView" data-view="home">
        <div class="welcome">
          <p class="eyebrow" id="todayText">今天</p>
          <h1>需要处理什么？</h1>
          <p>不上传，不登录。工具打开就能用。</p>
        </div>

        <button class="scan-hero" data-open-tool="docscan">
          <span class="scan-hero-icon"><svg><use href="#i-scan"/></svg></span>
          <span><small>A4 文档扫描</small><strong>自动裁边，清晰成稿</strong><em>透视矫正 · 多页 PDF · OCR</em></span>
          <svg class="chevron"><use href="#i-chevron"/></svg>
        </button>

        <div class="section-heading"><h2>常用工具</h2><button data-nav="tools">查看全部</button></div>
        <div class="quick-grid">
          <button class="quick-card coral" data-open-tool="pdf"><span class="quick-icon"><svg><use href="#i-note"/></svg></span><strong>PDF 工作台</strong><small>合并 · 签名 · 水印</small></button>
          <button class="quick-card blue" data-open-tool="screenshots"><span class="quick-icon"><svg><use href="#i-image"/></svg></span><strong>截图处理</strong><small>长图 · 打码</small></button>
          <button class="quick-card gold" data-open-tool="receipt"><span class="quick-icon"><svg><use href="#i-wallet"/></svg></span><strong>票据助手</strong><small>识别 · 报销记录</small></button>
          <button class="quick-card purple" data-open-tool="ocr"><span class="quick-icon"><svg><use href="#i-text"/></svg></span><strong>智能提取</strong><small>文字 · 电话 · 日期</small></button>
        </div>

        <div class="privacy-card">
          <span class="privacy-seal">✓</span>
          <div><strong>你的内容，只留在你的手机</strong><p>图片、文字和便签默认在本地处理。</p></div>
        </div>
      </section>

      <section class="view" id="toolsView" data-view="tools">
        <div class="page-title"><p class="eyebrow">工具库</p><h1>所有工具</h1></div>
        <label class="search-box"><span>⌕</span><input id="toolSearch" type="search" placeholder="搜索工具" autocomplete="off"></label>
        <div class="tool-list" id="toolList">
          <button data-open-tool="docscan" data-keywords="A4 文档 扫描 自动裁边 透视 增强 PDF 多页"><span class="list-icon green"><svg><use href="#i-scan"/></svg></span><span><strong>A4 文档扫描</strong><small>自动裁边、增强并导出 PDF</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="pdf" data-keywords="PDF 合并 拆分 页面 排序 签名 水印 图片 转换"><span class="list-icon coral"><svg><use href="#i-note"/></svg></span><span><strong>PDF 工作台</strong><small>按页重排、签名、水印与合并</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="screenshots" data-keywords="截图 长图 拼接 去重 打码 隐私 马赛克"><span class="list-icon blue"><svg><use href="#i-image"/></svg></span><span><strong>截图处理中心</strong><small>智能拼长图、手动打码和导出</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="receipt" data-keywords="票据 发票 小票 报销 金额 商家 CSV"><span class="list-icon gold"><svg><use href="#i-wallet"/></svg></span><span><strong>票据与报销助手</strong><small>识别金额日期并导出记录</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="ocr" data-keywords="扫描 文字 OCR 相机 中文 英文"><span class="list-icon blue"><svg><use href="#i-text"/></svg></span><span><strong>扫描文本</strong><small>拍照提取中英文文字</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="image" data-keywords="图片 压缩 裁剪 尺寸 JPG PNG 元数据"><span class="list-icon coral"><svg><use href="#i-image"/></svg></span><span><strong>图片处理</strong><small>压缩、旋转、改尺寸、去定位</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="text" data-keywords="文字 文本 字数 去重 空格 大小写"><span class="list-icon blue"><svg><use href="#i-text"/></svg></span><span><strong>文字工具</strong><small>统计、清理与格式转换</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="date" data-keywords="日期 间隔 年龄 天数"><span class="list-icon gold"><svg><use href="#i-calendar"/></svg></span><span><strong>日期计算</strong><small>日期间隔与年龄计算</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="units" data-keywords="单位 换算 长度 重量 温度"><span class="list-icon mint"><svg><use href="#i-ruler"/></svg></span><span><strong>单位换算</strong><small>长度、重量与温度</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="split" data-keywords="AA 分账 金额 小费 人数"><span class="list-icon pink"><svg><use href="#i-wallet"/></svg></span><span><strong>AA 分账</strong><small>快速算出每人应付</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <button data-open-tool="qr" data-keywords="二维码 QR 生成 扫码 WiFi"><span class="list-icon purple"><svg><use href="#i-qr"/></svg></span><span><strong>二维码工具</strong><small>生成二维码或从图片识别</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
        </div>
        <p class="empty-state" id="toolEmpty" hidden>没有找到相关工具</p>
      </section>

      <section class="view" id="notesView" data-view="notes">
        <div class="page-title notes-title"><div><p class="eyebrow">自动保存</p><h1>便签</h1></div><button class="primary-small" id="newNote">＋ 新建</button></div>
        <div class="notes-list" id="notesList"></div>
      </section>

      <section class="view" id="settingsView" data-view="settings">
        <div class="page-title"><p class="eyebrow">偏好</p><h1>设置</h1></div>
        <div class="settings-group">
          <button id="settingTheme"><span><svg><use href="#i-moon"/></svg></span><div><strong>外观模式</strong><small id="themeLabel">跟随系统</small></div><em>更改</em></button>
          <button id="installButton"><span>＋</span><div><strong>添加到主屏幕</strong><small>像 App 一样快速打开</small></div><em>添加</em></button>
        </div>
        <div class="settings-group danger-group">
          <button id="exportData"><span>⇧</span><div><strong>导出本地数据</strong><small>备份便签和报销记录</small></div><em>导出</em></button>
          <button id="clearData"><span><svg><use href="#i-trash"/></svg></span><div><strong>清除本地数据</strong><small>删除便签和报销记录</small></div><em>清除</em></button>
        </div>
        <div class="about-card"><div class="brand-mark large">轻</div><strong>轻捷 2.0</strong><p>为手机而生的隐私工具箱<br>所有核心计算都在设备本地完成</p></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="active" data-nav="home"><svg><use href="#i-home"/></svg><span>首页</span></button>
      <button data-nav="tools"><svg><use href="#i-grid"/></svg><span>工具</span></button>
      <button data-nav="notes"><svg><use href="#i-note"/></svg><span>便签</span></button>
      <button data-nav="settings"><svg><use href="#i-gear"/></svg><span>设置</span></button>
    </nav>
  </div>

  <div class="tool-sheet" id="toolSheet" aria-hidden="true">
    <div class="sheet-backdrop" data-close-tool></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="sheet-header"><button class="icon-button" data-close-tool aria-label="关闭"><svg><use href="#i-close"/></svg></button><div><small id="sheetKicker">轻捷工具</small><h2 id="sheetTitle">工具</h2></div><span class="header-spacer"></span></header>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <template id="tpl-ocr">
    <div class="tool-intro"><span class="hero-icon green"><svg><use href="#i-scan"/></svg></span><div><h3>扫描文本</h3><p>照片仅在此设备中识别，不会上传。</p></div></div>
    <label class="drop-zone"><input id="ocrFile" type="file" accept="image/*" capture="environment"><svg><use href="#i-camera"/></svg><strong>拍照或选择图片</strong><small>建议文字清晰、光线均匀</small></label>
    <img class="media-preview" id="ocrPreview" alt="待识别图片" hidden>
    <div class="field-row"><label class="field"><span>识别语言</span><select id="ocrLang"><option value="chi_sim+eng">中文 + English</option><option value="chi_sim">简体中文</option><option value="eng">English</option></select></label></div>
    <button class="primary-button" id="runOcr" disabled>开始识别</button>
    <div class="progress-wrap" id="ocrProgress" hidden><div><span id="ocrStatus">准备识别…</span><em id="ocrPercent">0%</em></div><progress value="0" max="1"></progress><small>首次使用需要加载离线识别组件</small></div>
    <label class="field result-field" id="ocrResultWrap" hidden><span>识别结果</span><textarea id="ocrResult" rows="9" placeholder="识别结果会显示在这里"></textarea></label>
    <div class="action-row" id="ocrActions" hidden><button class="secondary-button" id="copyOcr"><svg><use href="#i-copy"/></svg>复制</button><button class="secondary-button" id="saveOcr"><svg><use href="#i-note"/></svg>存为便签</button></div>
    <div class="smart-actions" id="ocrSmartActions" hidden><span class="control-label">识别出的快捷操作</span><div id="ocrActionList"></div></div>
  </template>

  <template id="tpl-pdf">
    <div class="tool-intro"><span class="hero-icon coral"><svg><use href="#i-note"/></svg></span><div><h3>PDF 工作台</h3><p>按页面重新组合 PDF 和图片，并加入签名或用途水印。</p></div></div>
    <label class="drop-zone"><input id="pdfFiles" type="file" accept="application/pdf,image/*" multiple><svg><use href="#i-note"/></svg><strong>选择 PDF 或图片</strong><small>可多选；每一页都能排序或删除</small></label>
    <div class="pdf-loading" id="pdfLoading" hidden><span class="spinner"></span><strong>正在读取文件…</strong></div>
    <section class="pdf-pages" id="pdfPagesSection" hidden><div class="section-heading"><h3>输出页面 <em id="pdfPageCount">0</em></h3><button id="clearPdfPages">清空</button></div><div class="pdf-page-list" id="pdfPageList"></div></section>
    <div class="pdf-options" id="pdfOptions" hidden>
      <label class="field"><span>用途水印（可选）</span><input id="pdfWatermark" type="text" placeholder="例如：仅供办理宽带使用" maxlength="40"></label>
      <label class="range-field"><span><b>水印深浅</b><em id="watermarkOpacityText">18%</em></span><input id="watermarkOpacity" type="range" min="8" max="45" value="18"></label>
      <div class="signature-block"><span class="control-label">手写签名（可选，签在每页右下角）</span><canvas id="signatureCanvas" width="700" height="220"></canvas><button class="text-button" id="clearSignature">清除签名</button></div>
      <button class="primary-button" id="exportPdfWorkbench">生成并保存 PDF</button>
      <p class="privacy-note">文件只在本机浏览器中重组，不会上传。</p>
    </div>
  </template>

  <template id="tpl-screenshots">
    <div class="tool-intro"><span class="hero-icon blue"><svg><use href="#i-image"/></svg></span><div><h3>截图处理中心</h3><p>自动识别重复区域，拼成长图后可直接涂黑隐私内容。</p></div></div>
    <label class="drop-zone"><input id="screenshotFiles" type="file" accept="image/*" multiple><svg><use href="#i-image"/></svg><strong>选择多张连续截图</strong><small>请按照从上到下的顺序选择</small></label>
    <div class="screenshot-list" id="screenshotList"></div>
    <button class="primary-button" id="stitchScreenshots" disabled>智能拼接长图</button>
    <div class="stitch-result" id="stitchResult" hidden>
      <div class="result-summary"><strong id="stitchInfo">拼接完成</strong><small>在图片上拖动，可涂黑手机号、姓名等隐私内容</small></div>
      <div class="redact-stage"><canvas id="stitchCanvas"></canvas></div>
      <div class="action-grid"><button id="undoRedaction">撤销打码</button><button id="clearRedactions">清除打码</button><button id="saveLongImage">保存长图</button><button id="saveLongPdf">保存 PDF</button></div>
    </div>
  </template>

  <template id="tpl-receipt">
    <div class="tool-intro"><span class="hero-icon gold"><svg><use href="#i-wallet"/></svg></span><div><h3>票据与报销助手</h3><p>识别商家、日期和金额，形成可导出的报销记录。</p></div></div>
    <label class="drop-zone"><input id="receiptFile" type="file" accept="image/*" capture="environment"><svg><use href="#i-camera"/></svg><strong>拍摄或选择票据</strong><small>尽量拍正、保持金额区域清晰</small></label>
    <img class="media-preview" id="receiptPreview" alt="票据预览" hidden>
    <button class="primary-button" id="recognizeReceipt" disabled>识别票据信息</button>
    <div class="progress-wrap" id="receiptProgress" hidden><div><span id="receiptStatus">准备识别…</span><em id="receiptPercent">0%</em></div><progress value="0" max="1"></progress></div>
    <div class="receipt-fields" id="receiptFields" hidden>
      <div class="two-fields"><label class="field"><span>商家</span><input id="receiptMerchant" type="text" placeholder="商家名称"></label><label class="field"><span>日期</span><input id="receiptDate" type="date"></label></div>
      <div class="two-fields"><label class="field"><span>金额</span><input id="receiptAmount" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></label><label class="field"><span>分类</span><select id="receiptCategory"><option>餐饮</option><option>交通</option><option>办公</option><option>住宿</option><option>购物</option><option>其他</option></select></label></div>
      <label class="field"><span>备注</span><input id="receiptNote" type="text" placeholder="项目或报销说明"></label>
      <button class="primary-button" id="saveReceiptRecord">保存到报销记录</button>
      <details class="raw-text"><summary>查看识别原文</summary><textarea id="receiptRawText" rows="7"></textarea></details>
    </div>
    <section class="receipt-records" id="receiptRecordsSection" hidden><div class="section-heading"><h3>报销记录 <em id="receiptRecordCount">0</em></h3><button id="exportReceiptCsv">导出 CSV</button></div><div id="receiptRecordList"></div><button class="danger-button" id="clearReceiptRecords">清空全部记录</button></section>
  </template>

  <template id="tpl-docscan">
    <div class="tool-intro"><span class="hero-icon green"><svg><use href="#i-scan"/></svg></span><div><h3>A4 文档扫描</h3><p>自动找边、矫正透视并增强纸面清晰度。</p></div></div>
    <label class="drop-zone" id="scanDropZone"><input id="scanFile" type="file" accept="image/*" capture="environment"><svg><use href="#i-camera"/></svg><strong>拍摄或选择 A4 文档</strong><small>尽量拍全四角，避免强烈反光</small></label>
    <div class="scan-loading" id="scanLoading" hidden><span class="spinner"></span><strong>正在分析文档边缘…</strong><small>首次使用需加载本地扫描组件</small></div>
    <div class="scanner-workspace" id="scannerWorkspace" hidden>
      <div class="scan-stage" id="scanSourceStage">
        <canvas id="scanSourceCanvas"></canvas>
        <svg id="scanCornerOverlay" aria-label="文档边角调整区域"><polygon></polygon><circle data-corner="0" r="22"></circle><circle data-corner="1" r="22"></circle><circle data-corner="2" r="22"></circle><circle data-corner="3" r="22"></circle></svg>
        <span class="scan-tip">拖动圆点调整纸张边角</span>
      </div>
      <canvas class="scan-result-canvas" id="scanResultCanvas" hidden></canvas>
      <div class="scan-toolbar"><button class="secondary-button" id="scanRedetect">重新找边</button><button class="primary-inline" id="scanApply">应用裁切与增强</button><button class="secondary-button" id="scanAdjust" hidden>调整边角</button></div>
      <div id="scanEffectPanel" hidden>
        <span class="control-label">扫描效果</span>
        <div class="segmented scan-modes"><button data-scan-mode="original">原图</button><button class="active" data-scan-mode="color">彩色增强</button><button data-scan-mode="gray">灰度</button><button data-scan-mode="bw">黑白</button></div>
        <div class="action-grid scan-actions"><button id="scanAddPage">＋ 加入多页</button><button id="scanSaveJpg">保存 JPG</button><button id="scanToOcr">提取文字</button><button id="scanNewPhoto">继续拍摄</button></div>
      </div>
    </div>
    <section class="scan-pages" id="scanPagesSection" hidden><div class="section-heading"><h3>已扫描页面 <em id="scanPageCount">0</em></h3><button id="clearScanPages">清空</button></div><div class="scan-page-list" id="scanPageList"></div><button class="primary-button" id="exportScanPdf">导出多页 PDF</button></section>
  </template>

  <template id="tpl-image">
    <div class="tool-intro"><span class="hero-icon coral"><svg><use href="#i-image"/></svg></span><div><h3>图片处理</h3><p>压缩、改尺寸并自动移除照片元数据。</p></div></div>
    <label class="drop-zone"><input id="imageFile" type="file" accept="image/*"><svg><use href="#i-image"/></svg><strong>选择一张图片</strong><small>支持系统可读取的图片格式</small></label>
    <img class="media-preview" id="imagePreview" alt="图片预览" hidden>
    <div class="two-fields"><label class="field"><span>最长边</span><select id="imageSize"><option value="0">保持原尺寸</option><option value="2560">2560 px</option><option value="1920" selected>1920 px</option><option value="1280">1280 px</option><option value="800">800 px</option></select></label><label class="field"><span>输出格式</span><select id="imageFormat"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label></div>
    <label class="range-field"><span><b>图片质量</b><em id="qualityText">82%</em></span><input id="imageQuality" type="range" min="35" max="100" value="82"></label>
    <div class="segmented"><button class="active" data-rotate="0">不旋转</button><button data-rotate="90">右转 90°</button><button data-rotate="-90">左转 90°</button></div>
    <button class="primary-button" id="processImage" disabled>处理图片</button>
    <div class="result-card" id="imageResult" hidden><img id="outputPreview" alt="处理后的图片"><div><strong id="outputInfo">处理完成</strong><small>重新编码后已移除定位等元数据</small></div><div class="action-row"><button class="secondary-button" id="downloadImage">保存图片</button><button class="secondary-button" id="shareImage"><svg><use href="#i-share"/></svg>分享</button></div></div>
  </template>

  <template id="tpl-text">
    <div class="tool-intro"><span class="hero-icon blue"><svg><use href="#i-text"/></svg></span><div><h3>文字工具</h3><p>所有处理即时完成，不会离开设备。</p></div></div>
    <label class="field result-field"><span>输入文字</span><textarea id="textInput" rows="10" placeholder="粘贴或输入需要整理的文字…"></textarea></label>
    <div class="stats-strip"><div><strong id="statChars">0</strong><small>字符</small></div><div><strong id="statWords">0</strong><small>词数</small></div><div><strong id="statLines">0</strong><small>行数</small></div></div>
    <div class="action-grid"><button data-text-action="spaces">清理空格</button><button data-text-action="dedupe">行去重</button><button data-text-action="upper">转大写</button><button data-text-action="lower">转小写</button><button data-text-action="trim">清理空行</button><button data-text-action="copy">复制结果</button></div>
  </template>

  <template id="tpl-date">
    <div class="tool-intro"><span class="hero-icon gold"><svg><use href="#i-calendar"/></svg></span><div><h3>日期计算</h3><p>计算两个日期的间隔，或查看准确年龄。</p></div></div>
    <div class="segment-tabs"><button class="active" data-date-tab="gap">日期间隔</button><button data-date-tab="age">年龄计算</button></div>
    <div id="dateGapPanel"><div class="two-fields"><label class="field"><span>开始日期</span><input id="dateStart" type="date"></label><label class="field"><span>结束日期</span><input id="dateEnd" type="date"></label></div><div class="big-result" id="dateGapResult"><small>相差</small><strong>0 天</strong><p>请选择开始和结束日期</p></div></div>
    <div id="agePanel" hidden><label class="field"><span>出生日期</span><input id="birthDate" type="date"></label><div class="big-result" id="ageResult"><small>现在年龄</small><strong>—</strong><p>请选择出生日期</p></div></div>
  </template>

  <template id="tpl-units">
    <div class="tool-intro"><span class="hero-icon mint"><svg><use href="#i-ruler"/></svg></span><div><h3>单位换算</h3><p>长度、重量和温度快速互转。</p></div></div>
    <div class="segment-tabs" id="unitCategory"><button class="active" data-unit-category="length">长度</button><button data-unit-category="weight">重量</button><button data-unit-category="temp">温度</button></div>
    <label class="field"><span>数值</span><input id="unitValue" type="number" inputmode="decimal" value="1" step="any"></label>
    <div class="conversion-row"><label class="field"><span>从</span><select id="unitFrom"></select></label><button id="swapUnits" aria-label="交换单位">⇄</button><label class="field"><span>到</span><select id="unitTo"></select></label></div>
    <div class="big-result"><small>换算结果</small><strong id="unitResult">—</strong><p id="unitFormula"></p></div>
  </template>

  <template id="tpl-split">
    <div class="tool-intro"><span class="hero-icon pink"><svg><use href="#i-wallet"/></svg></span><div><h3>AA 分账</h3><p>算上服务费或小费，快速得出每人应付。</p></div></div>
    <label class="field money-field"><span>消费金额</span><div><b>¥</b><input id="billAmount" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01"></div></label>
    <div class="two-fields"><label class="field"><span>人数</span><input id="peopleCount" type="number" inputmode="numeric" value="2" min="1"></label><label class="field"><span>附加比例</span><select id="tipRate"><option value="0">无</option><option value="5">5%</option><option value="10">10%</option><option value="15">15%</option><option value="20">20%</option></select></label></div>
    <div class="big-result accent-result"><small>每人应付</small><strong id="perPerson">¥0.00</strong><p id="splitDetail">共 ¥0.00 · 2 人</p></div>
  </template>

  <template id="tpl-qr">
    <div class="tool-intro"><span class="hero-icon purple"><svg><use href="#i-qr"/></svg></span><div><h3>二维码工具</h3><p>生成二维码，或从相机与相册识别。</p></div></div>
    <div class="segment-tabs"><button class="active" data-qr-tab="generate">生成</button><button data-qr-tab="scan">扫描</button></div>
    <div id="qrGeneratePanel"><label class="field result-field"><span>文字或网址</span><textarea id="qrText" rows="4" placeholder="输入要生成二维码的内容"></textarea></label><button class="primary-button" id="generateQr">生成二维码</button><div class="qr-output" id="qrOutput" hidden><canvas id="qrCanvas"></canvas><button class="secondary-button" id="saveQr">保存二维码</button></div></div>
    <div id="qrScanPanel" hidden><label class="drop-zone"><input id="qrFile" type="file" accept="image/*" capture="environment"><svg><use href="#i-camera"/></svg><strong>拍摄或选择二维码</strong><small>图片只在本地识别</small></label><img class="media-preview" id="qrPreview" alt="二维码图片" hidden><div class="result-card text-result" id="qrScanResult" hidden><small>识别结果</small><strong id="qrScanText"></strong><button class="secondary-button" id="copyQr">复制内容</button></div></div>
  </template>

  <template id="tpl-note-editor">
    <label class="field"><span>标题</span><input id="noteTitle" type="text" placeholder="便签标题" maxlength="80"></label>
    <label class="field result-field"><span>内容</span><textarea id="noteContent" rows="14" placeholder="随手记点什么…"></textarea></label>
    <p class="autosave-hint" id="noteSaveHint">内容会自动保存到本机</p>
    <button class="danger-button" id="deleteNote"><svg><use href="#i-trash"/></svg>删除这条便签</button>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
